
name: Prime Factors Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run tests and Pylint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pylint

      - name: Run tests
        run: python -m pytest -v

      - name: Check code style with Pylint
        run: python -m pylint prime.py Test/test_generate_prime_factors.py
